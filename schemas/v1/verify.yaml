# One fan-out request per drafted answer. State: the question, the cited passages keyed E1.., and the claims keyed C1..
# Every question is asked once per claim; {claim} is replaced by the claim key.
name: verify
questions:
  support:
    type: choice
    instructions: Do the passages that claim {claim} cites support claim {claim}?
    criteria:
      supports: The cited passages state the claim or clearly imply all of it.
      contradicts: The cited passages say the opposite of the claim.
      unrelated: The cited passages are about something else.
      insufficient: The cited passages are on the same topic but do not establish the claim, or they back only part of it, or the claim adds a reason, cause or detail the passages do not give.
  direct:
    type: noul
    instructions: Do the passages that claim {claim} cites state the claim explicitly, so that no inference is needed?
  addresses:
    type: noul
    instructions: Does claim {claim} itself answer the question that was asked? Background that is true but leaves the question open does not count; for a why-question, a description of what was changed without the reason does not count.
