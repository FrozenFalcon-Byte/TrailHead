# One fan-out request per source file. State: path, header docstring, symbol signatures.
name: file
questions:
  layer:
    type: choice
    instructions: Which architectural layer does this file belong to?
    criteria:
      ui: The file renders output for people, such as templates, pages or command-line text.
      api_routes: The file defines public entry points that receive external requests or commands.
      business_logic: The file implements the core behaviour of the project.
      data_access: The file reads or writes storage, files, caches, queues or network connections.
      config_infra: The file holds settings, defaults, packaging, deployment or CI configuration.
      tests: The file contains automated tests or test helpers.
      docs: The file is documentation.
      build_tooling: The file is a developer script or build helper that is not shipped behaviour.
      generated_or_vendored: The file was produced by a tool or copied from another project.
      other: The file fits none of the other options.
  role:
    type: choice
    instructions: Which role does this file play inside its package?
    criteria:
      entry_point: Execution starts here, such as a main function, a command or an application object.
      core_module: The file defines the main classes or functions that other files build on.
      helpers: The file is a collection of small utility functions used by other files.
      type_definitions: The file mostly declares types, interfaces, exceptions or constants.
      example_or_fixture: The file is sample code, test data or a fixture.
      other: The file fits none of the other options.
  is_generated:
    type: noul
    instructions: Was this file produced by a code generator instead of being written by a person?
  exposes_public_api:
    type: noul
    instructions: Does this file define names that code outside this project is expected to import or call?
  newcomer_difficulty:
    type: score
    instructions: How much background does a new contributor need before they can change this file safely?
    criteria:
      - The file is trivial, such as constants, a short script or plain documentation.
      - The file is self-contained and can be understood by reading it alone.
      - Understanding the file requires reading a few other files of the project.
      - Understanding the file requires deep knowledge of the project's architecture or of an external system.
