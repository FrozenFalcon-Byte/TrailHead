<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf8f1" />
    <meta name="description" content="Trailhead turns any GitHub repository and a goal into a guided reading tour and cited, calibrated answers." />
    <title>Trailhead — find your way into any codebase</title>
    <script>
      // A browser that cached a wrong copy of a script (a page served in its place mid-deploy) would stay blank: refetch
      // the app's scripts past the cache and reload once.
      addEventListener('error', function (e) {
        var s = e.target, src = s && s.tagName === 'SCRIPT' && s.src
        if (!src || src.indexOf('/assets/') < 0) return
        try { if (sessionStorage.getItem('th-heal')) return; sessionStorage.setItem('th-heal', '1') } catch (x) { return }
        fetch(src, { cache: 'reload' }).then(function (r) { return r.text() }).then(function (t) {
          var deps = t.match(/"\.\/[\w.-]+\.js"/g) || []
          return Promise.all(deps.map(function (d) { return fetch(new URL(d.slice(1, -1), src), { cache: 'reload' }) }))
        }).finally(function () { location.reload() })
      }, true)
      addEventListener('load', function () { setTimeout(function () { var r = document.getElementById('root'); if (r && r.firstChild) try { sessionStorage.removeItem('th-heal') } catch (x) {} }, 8000) })
    </script>
  </head>
  <body>
    <script>
      // Coming back from "Update now": paint the update sheet's colour until the app takes over, so the reload has no flash.
      try { if (sessionStorage.getItem('th-arrive')) document.write('<div id="th-pre" style="position:fixed;inset:0;z-index:10000;background:#17161b"></div>') } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
