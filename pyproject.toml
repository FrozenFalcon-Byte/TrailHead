[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailhead"
version = "0.1.0"
description = "Codebase onboarding engine: Jev decides, an LLM writes, code owns control flow."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6", "tree-sitter>=0.23", "tree-sitter-python>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
trailhead = "trailhead.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls real external APIs; needs keys in .env (deselected by default)"]
addopts = "-m 'not live'"
